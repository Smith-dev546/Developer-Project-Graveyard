<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Memorial interactivo donde los desarrolladores entierran sus proyectos abandonados, dejan flores y resucitan ideas." />
    <title>El Cementerio de Proyectos Abandonados</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="hero">
      <p class="hero-sub">Aquí descansan los repositorios que nunca vieron producción</p>
      <h1>El Cementerio de Proyectos Abandonados</h1>
      <button id="btn-new" class="btn primary" type="button">Enterrar un proyecto</button>
    </header>

    <main class="wrap">
      <section aria-labelledby="t-stats">
        <h2 id="t-stats">Estadísticas del camposanto</h2>
        <div id="stats" class="stats"></div>
      </section>

      <section aria-labelledby="t-list">
        <h2 id="t-list">Lápidas</h2>
        <form id="filters" class="filters" onsubmit="return false">
          <label>Buscar
            <input id="f-q" type="search" placeholder="Nombre, autor o epitafio" />
          </label>
          <label>Causa de muerte
            <select id="f-cause"></select>
          </label>
          <label>Estado
            <select id="f-status">
              <option value="">Todos</option>
              <option value="Abandonado">Abandonado</option>
              <option value="Resucitado">Resucitado</option>
            </select>
          </label>
        </form>
        <p id="count" class="count" aria-live="polite"></p>
        <div id="grid" class="grid"></div>
      </section>
    </main>

    <footer class="foot">Datos guardados en SQLite dentro de tu navegador. Ningún proyecto fue dañado en la creación de este sitio.</footer>

    <dialog id="dlg-form">
      <form id="form" novalidate>
        <h2 id="form-title">Enterrar un proyecto</h2>
        <input type="hidden" id="p-id" />
        <label>Nombre del proyecto *
          <input id="p-name" maxlength="60" required />
        </label>
        <label>Tu nombre o usuario *
          <input id="p-author" maxlength="40" required />
        </label>
        <label>Epitafio
          <input id="p-epitaph" maxlength="100" placeholder="Una frase para recordarlo" />
        </label>
        <label>Autopsia (qué era y qué pasó)
          <textarea id="p-desc" rows="3" maxlength="400"></textarea>
        </label>
        <label>Causa de muerte
          <select id="p-cause"></select>
        </label>
        <label>Nivel de progreso: <output id="p-progress-out">50</output>%
          <input id="p-progress" type="range" min="0" max="100" step="5" value="50" />
        </label>
        <label>Stack usado (separado por comas)
          <input id="p-techs" placeholder="React, Node, PostgreSQL" />
        </label>
        <p id="form-error" class="error" role="alert" hidden></p>
        <div class="actions">
          <button type="button" class="btn" data-close="dlg-form">Cancelar</button>
          <button type="submit" class="btn primary" id="form-submit">Guardar lápida</button>
        </div>
      </form>
    </dialog>

    <dialog id="dlg-res">
      <form id="res-form">
        <h2>Resucitar proyecto</h2>
        <p id="res-text"></p>
        <input type="hidden" id="r-id" />
        <label>Tu nombre o usuario *
          <input id="r-name" maxlength="40" required />
        </label>
        <div class="actions">
          <button type="button" class="btn" data-close="dlg-res">Cancelar</button>
          <button type="submit" class="btn primary">Adoptar la idea</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
